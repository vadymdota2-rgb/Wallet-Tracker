# Автотесты на каждый push и pull request.
#
# unit — быстрые: типы TypeScript, синтаксис сервера (Python), тесты расчёта
#        в приложении (node --test) и тесты сервера (unittest, сеть подменена).
# e2e  — карточка халвинга, «Институциональные потоки» и подсказки «?» в
#        настоящем Chromium на свежесобранном html/.
# mutation — мутационная проверка модулей халвинга и «Институциональных
#        потоков»: портит код в десятках мест и требует, чтобы тесты заметили
#        каждую значимую порчу.
#
# tools/guard.py здесь не запускается: он сверяет приложение и с ботом из
# соседнего репозитория WhaleScanner, которого в этой проверке нет.
name: tests

# Только main: каждый коммит рабочей ветки уходит и в main, и тесты на двух
# ветках шли бы дважды на одном и том же коде.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Наименьшие права: тестам нужно только прочитать код. Сторонние действия
# закреплены по хешу коммита, а не по метке v4: метку можно перевесить на
# подменённый код, хеш — нет. Токен после checkout не остаётся на диске.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Типы TypeScript (приложение и тесты; модули халвинга, ETF и альтсезона — в строжайшем режиме)
        run: npm run typecheck && npm run typecheck:tests && npm run typecheck:halving && npm run typecheck:etf && npm run typecheck:dom
      - name: Синтаксис сервера
        run: python -m py_compile whale_api.py wt_halving.py wt_etf.py wt_treasury.py wt_dom.py wt_mcap.py wt_shield.py wt_digest_img.py
      - name: Анализатор Python (модуль халвинга и его тесты)
        run: >-
          pipx run ruff==0.15.8 check --target-version py310
          --select E,F,W,B,UP,SIM,PL,RUF,S,BLE,I --ignore E501,PLR2004,RUF001,RUF002,RUF003,S310,S603,S607
          wt_halving.py tests/test_halving_api.py tests/test_halving_fuzz.py tests/test_halving_security.py tests/test_halving_policy.py tools/mutate-halving.py
          wt_etf.py tests/test_etf_api.py tests/test_etf_day_alert.py tests/test_etf_fuzz.py tests/test_etf_security.py tests/test_etf_policy.py tools/mutate-etf.py
          tests/test_bootstrap_personal.py tests/test_btc_etf_labels.py
          wt_treasury.py tests/test_treasury.py tests/test_treasury_security.py tests/test_digest_sources.py tests/test_digest_channel.py
          wt_dom.py tests/test_dom.py tests/test_dom_policy.py tests/test_dom_fuzz.py tests/test_dom_http.py wt_mcap.py tests/test_mcap.py tests/test_mcap_fuzz.py
      - name: Строгие типы Python (mypy --strict)
        run: >-
          pipx run mypy==1.11.2 --strict --python-version 3.11 wt_halving.py wt_etf.py wt_treasury.py wt_dom.py wt_mcap.py
      - name: Тесты расчёта и сервера
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Сборка приложения
        run: npm run build
      - name: Браузерные тесты (халвинг и «Институциональные потоки»)
        run: npm run test:e2e

  # Сервер может стоять на любом Python 3.10–3.13 — модуль обязан работать на всех.
  server-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Тесты сервера халвинга (вкл. фаззинг и договор с приложением)
        run: python -m unittest discover -s tests -p 'test_*.py'

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Мутационная проверка модуля халвинга
        run: python tools/mutate-halving.py

  # «Институциональные потоки» — отдельным заданием (параллельно халвингу):
  # мутаций больше двух сотен (ETF, альтсезон, доминация), вместе с халвингом
  # они не укладывались в 10 минут; сейчас — около 22 минут, лимит с запасом.
  mutation-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Мутационная проверка «Институциональных потоков»
        run: python tools/mutate-etf.py
