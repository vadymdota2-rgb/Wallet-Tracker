# Автотесты на каждый push и pull request.
#
# unit — быстрые: типы TypeScript, синтаксис сервера (Python), тесты расчёта
#        в приложении (node --test) и тесты сервера (unittest, сеть подменена).
# e2e  — карточка халвинга в настоящем Chromium на свежесобранном html/.
# mutation — мутационная проверка модуля халвинга: портит код в 30 местах и
#        требует, чтобы тесты заметили каждую значимую порчу.
#
# tools/guard.py здесь не запускается: он сверяет приложение и с ботом из
# соседнего репозитория WhaleScanner, которого в этой проверке нет.
name: tests

# Только main: каждый коммит рабочей ветки уходит и в main, и тесты на двух
# ветках шли бы дважды на одном и том же коде.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Типы TypeScript (приложение и тесты; модуль халвинга — в строжайшем режиме)
        run: npm run typecheck && npm run typecheck:tests && npm run typecheck:halving
      - name: Синтаксис сервера
        run: python -m py_compile whale_api.py wt_halving.py wt_shield.py wt_digest_img.py
      - name: Анализатор Python (модуль халвинга и его тесты)
        run: >-
          pipx run ruff==0.15.8 check --target-version py310
          --select E,F,W,B,UP,SIM,PL,RUF,S,BLE --ignore E501,PLR2004,RUF001,RUF002,RUF003,S310,S603,S607
          wt_halving.py tests/test_halving_api.py tests/test_halving_fuzz.py tools/mutate-halving.py
      - name: Строгие типы Python (mypy --strict)
        run: pipx run mypy==1.11.2 --strict --python-version 3.11 wt_halving.py
      - name: Тесты расчёта и сервера
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Сборка приложения
        run: npm run build
      - name: Браузерный тест карточки халвинга
        run: npm run test:e2e

  # Сервер может стоять на любом Python 3.10–3.13 — модуль обязан работать на всех.
  server-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Тесты сервера халвинга (вкл. фаззинг и договор с приложением)
        run: python -m unittest discover -s tests -p 'test_*.py'

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Мутационная проверка модуля халвинга
        run: python tools/mutate-halving.py
