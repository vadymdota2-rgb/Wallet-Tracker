# Перебор chat_id и долбёжка внешних бирж упираются сюда.
# Кэш логотипов внутри контейнера: повторный запрос не уходит наружу.
# /tmp на Cloud Run — это оперативная память, поэтому объём скромный.
proxy_cache_path /tmp/logocache levels=1:2 keys_zone=logos:8m
                 max_size=48m inactive=30d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=ext:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ВАЖНО: add_header НЕ наследуется в location, где есть свой add_header.
    # Раньше эти три строки стояли только здесь и до браузера не доезжали
    # ни на одной странице. Поэтому они повторены в каждом location ниже.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # X-Frame-Options: ALLOW-FROM — мёртвый синтаксис, современные браузеры
    # его игнорируют. Рабочий способ ограничить встраивание — CSP.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        # Подставляется в start.sh из переменной API_KEY. Без этого заголовка
        # API отвечает 403, поэтому прямое обращение на порт 8090 мимо nginx
        # ничего не даёт.
        proxy_set_header X-Api-Key "__API_KEY__";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 180 секунд ожидания — это телефон с крутилкой на три минуты.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /quotes {
        limit_req zone=api burst=30 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_pass http://127.0.0.1:8090/api/quotes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_set_header X-Api-Key "__API_KEY__";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Логотипы спотовых токенов BSC берём по адресу контракта. PancakeSwap и
    # Trust Wallet хотят запись EIP-55 (в нижнем регистре оба отдают 404),
    # DexScreener — наоборот нижний регистр.
    location /pcslogo/ {
        proxy_cache logos;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 403 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Logo-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://tokens.pancakeswap.finance/images/;
        proxy_ssl_server_name on;
        proxy_set_header Host tokens.pancakeswap.finance;
    }

    location /twlogo/ {
        proxy_cache logos;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 403 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Logo-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/smartchain/assets/;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
    }

    # Третий источник для BSC: у DexScreener есть логотипы токенов, которых
    # нет ни в PancakeSwap, ни в Trust Wallet, — он их и добирает.
    #
    # Отвечает он редиректом на свой CDN, и раньше это приняли за отказ:
    # без -L видно только «301». Редирект не трогаем — картинку по нему
    # дотянет сам браузер, тег img ходит по редиректам и на чужой домен, а
    # img-src мы не ограничиваем.
    location /dslogo/ {
        proxy_cache logos;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 403 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_redirect off;
        add_header X-Logo-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://dd.dexscreener.com/ds-data/tokens/bsc/;
        proxy_ssl_server_name on;
        proxy_set_header Host dd.dexscreener.com;
    }

    location /hllogo/ {
        proxy_cache logos;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 403 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Logo-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://app.hyperliquid.xyz/coins/;
        proxy_ssl_server_name on;
        proxy_set_header Host app.hyperliquid.xyz;
    }

    location /cglogo/ {
        proxy_cache logos;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 403 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Logo-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://coin-images.coingecko.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host coin-images.coingecko.com;
    }

    location /klines {
        limit_req zone=ext burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.binance.com/api/v3/klines;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_read_timeout 20s;
    }

    location /klines-vision {
        limit_req zone=ext burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://data-api.binance.vision/api/v3/klines;
        proxy_ssl_server_name on;
        proxy_set_header Host data-api.binance.vision;
        proxy_read_timeout 20s;
    }

    location /klines-bybit {
        limit_req zone=ext burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.bybit.com/v5/market/kline;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bybit.com;
        proxy_read_timeout 20s;
    }

    location /klines-kucoin {
        limit_req zone=ext burst=10 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.kucoin.com/api/v1/market/candles;
        proxy_ssl_server_name on;
        proxy_set_header Host api.kucoin.com;
        proxy_read_timeout 20s;
    }

    # Логотипы, приехавшие вместе с образом: отдаются с диска, наружу
    # запросов нет вообще. Имена содержат адрес контракта или имя монеты,
    # поэтому держим год.
    location /coins/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Файлы С ХЕШЕМ в имени (styles-QImLFP2t.css) неизменны по определению:
    # держим год.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Страховка: файл в /assets/ без хеша в имени. Сборка таких не делает,
    # но если он появится — короткая проверка по ETag, а не год кэша.
    # Именно на этом раньше ломался выкат: браузер брал новый app.js вместе
    # с прошлогодним routes.js и падал с «Unexpected end of input».
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
