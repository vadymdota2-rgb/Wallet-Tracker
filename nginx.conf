server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_read_timeout 180s;
    }

    location /tvlogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://s3-symbol-logo.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host s3-symbol-logo.tradingview.com;
        proxy_hide_header x-amz-id-2;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /dexlogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://dd.dexscreener.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host dd.dexscreener.com;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /hllogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://app.hyperliquid.xyz/coins/;
        proxy_ssl_server_name on;
        proxy_set_header Host app.hyperliquid.xyz;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /klines {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.binance.com/api/v3/klines;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_read_timeout 20s;
    }

    location /quotes {
        proxy_pass http://127.0.0.1:8090/api/quotes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /coins/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
