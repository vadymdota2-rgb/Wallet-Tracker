limit_req_zone $binary_remote_addr zone=ext:10m rate=30r/m;

server {
    # Заголовки безопасности: для приложения с деньгами обязательны.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;

    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
        proxy_read_timeout 180s;
    }

    location /tvlogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://s3-symbol-logo.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host s3-symbol-logo.tradingview.com;
        proxy_hide_header x-amz-id-2;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /dexlogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://dd.dexscreener.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host dd.dexscreener.com;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /hllogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://app.hyperliquid.xyz/coins/;
        proxy_ssl_server_name on;
        proxy_set_header Host app.hyperliquid.xyz;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /klines {
        limit_req zone=ext burst=10 nodelay;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.binance.com/api/v3/klines;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_read_timeout 20s;
    }


    location /klines-vision {
        limit_req zone=ext burst=10 nodelay;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://data-api.binance.vision/api/v3/klines;
        proxy_ssl_server_name on;
        proxy_set_header Host data-api.binance.vision;
        proxy_read_timeout 20s;
    }

    location /klines-bybit {
        limit_req zone=ext burst=10 nodelay;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.bybit.com/v5/market/kline;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bybit.com;
        proxy_read_timeout 20s;
    }

    location /klines-kucoin {
        limit_req zone=ext burst=10 nodelay;
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://api.kucoin.com/api/v1/market/candles;
        proxy_ssl_server_name on;
        proxy_set_header Host api.kucoin.com;
        proxy_read_timeout 20s;
    }

    location /cglogo/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://coin-images.coingecko.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host coin-images.coingecko.com;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /quotes {
        proxy_pass http://127.0.0.1:8090/api/quotes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_set_header X-Telegram-Init-Data $http_x_telegram_init_data;
    }

    location /coins/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        # Файлы с хешем в имени: держим вечно. Pragma убран — он спорил
        # с immutable, и браузер каждый раз качал 400 КБ заново.
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
}
