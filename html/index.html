<style>
  html, body { background: #01030a; }

    background-size: 36px 36px; background-position: center;
    -webkit-mask: radial-gradient(circle at 50% 46%, #000 0, transparent 60%);
    mask: radial-gradient(circle at 50% 46%, #000 0, transparent 60%);

  .sp-c { position: absolute; left: 50%; top: 46%; width: 0; height: 0; }

  .sp-ring {

       в кадре на любом телефоне. */
    --rs: min(94vw, 76vh, 560px);
    position: absolute; left: calc(var(--rs) / -2); top: calc(var(--rs) / -2);
    width: var(--rs); height: var(--rs); border-radius: 50%;
    border: 1.5px solid rgb(127 216 255 / 0.55);
    box-shadow: 0 0 18px rgb(30 155 255 / 0.35), inset 0 0 18px rgb(30 155 255 / 0.2);
    opacity: 0; transform: scale(0.3);
    animation: spRing 2.4s cubic-bezier(.2,.6,.3,1) infinite;
    animation-delay: calc(0.75s * var(--k) + var(--i) * 0.8s);
  }
  @keyframes spRing {
    0% { opacity: 0; transform: scale(0.3); }
    12% { opacity: 0.9; }
    80% { opacity: 0.35; }
    100% { opacity: 0; transform: scale(1); }
  }
  /* Точки сделок: летят к центру со всех сторон. */
  .sp-dot {
    position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / -2);
    width: var(--s); height: var(--s); border-radius: 50%;
    background: var(--col); box-shadow: 0 0 8px var(--col), 0 0 2px #fff;
    opacity: 0; transform: rotate(var(--a)) translateX(var(--d));
    animation: spDot var(--t) cubic-bezier(.55,0,.75,.4) infinite;
    animation-delay: calc(0.25s * var(--k) + var(--w));
  }
  @keyframes spDot {
    0% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(0.6); }
    20% { opacity: 1; }
    85% { opacity: 0.9; }
    100% { opacity: 0; transform: rotate(calc(var(--a) + 25deg)) translateX(34px) scale(1.2); }
  }
  /* Логотип: кошелёк с лупой, как у бота. Иконка из линий — каждая
     линия рисуется светом по очереди, потом по стеклу лупы проходит
     блик. Лупа стоит на месте: мелкое покачивание на телефоне выглядело
     как дрожание. */
  /* Свечение логотипа не анимируется фильтром — это тяжело для телефона
     и давало дрожание. Дышит отдельный ореол: меняется только прозрачность. */
  .sp-mark {
    position: absolute; left: -105px; top: -105px; width: 210px; height: 210px;
    filter: drop-shadow(0 0 12px rgb(30 155 255 / 0.7));
    will-change: transform, opacity;
  }
  .sp-halo {
    position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgb(30 155 255 / 0.35) 0%, rgb(30 155 255 / 0.12) 40%, transparent 70%);
    opacity: 0; will-change: opacity;
    animation: spHaloIn calc(0.8s * var(--k)) ease-out calc(0.9s * var(--k)) forwards,

  }

  @keyframes spBreath { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .sp-mark svg { width: 100%; height: 100%; overflow: visible; }
  .sp-s {
    fill: none; stroke: url(#spStroke); stroke-width: 3.9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: spDraw calc(var(--l) * var(--k)) cubic-bezier(.65,0,.35,1) calc(var(--d) * var(--k)) forwards;
  }
  .sp-s.handle { stroke-width: 6; }
  @keyframes spDraw { to { stroke-dashoffset: 0; } }
  .sp-dotc {
    fill: #7fd8ff; transform-box: fill-box; transform-origin: center; transform: scale(0);
    animation: spPop calc(0.45s * var(--k)) cubic-bezier(.34,1.8,.5,1) calc(0.95s * var(--k)) forwards;
  }
  @keyframes spPop { to { transform: scale(1); } }
  /* Стекло лупы: вспыхивает, когда лупа нарисована. */
  .sp-glass {
    fill: url(#spGlass); opacity: 0;
    animation: spGlass calc(0.6s * var(--k)) ease-out calc(1.15s * var(--k)) forwards;
  }
  @keyframes spGlass { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0.55; } }
  /* Блик по стеклу. */
  .sp-shine { transform: translateX(-30px) skewX(-20deg); animation: spShine calc(0.8s * var(--k)) ease-in-out calc(1.3s * var(--k)) forwards; }
  @keyframes spShine { to { transform: translateX(40px) skewX(-20deg); } }
  /* Название: буквы проявляются по одной. */
  .sp-name {
    position: absolute; left: 0; right: 0; top: calc(46% + 122px);
    display: flex; justify-content: center; gap: 0.06em;
    font-weight: 700; font-size: 20px; letter-spacing: 0.22em; color: #eaf5ff;
    text-shadow: 0 0 18px rgb(30 155 255 / 0.6);
  }
  .sp-name span {
    display: inline-block; opacity: 0; transform: translateY(14px); filter: blur(8px);
    animation: spLetter calc(0.55s * var(--k)) cubic-bezier(.22,1,.36,1) forwards;
    animation-delay: calc((0.7s + var(--i) * 0.04s) * var(--k));
  }
  .sp-name .sp-sp { width: 0.5em; }
  @keyframes spLetter { to { opacity: 1; transform: none; filter: none; } }
  @keyframes spTag { to { opacity: 0.75; } }
  /* Полоса загрузки. */
  .sp-bar {
    position: absolute; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    width: 120px; height: 2px; margin-left: -60px; border-radius: 2px; overflow: hidden;
    background: rgb(30 155 255 / 0.15); opacity: 0;
    animation: spTag 0.4s ease-out calc(0.9s * var(--k)) forwards;
  }
  .sp-bar i {
    position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #7fd8ff, transparent);
    animation: spRun 1.1s ease-in-out infinite;
  }
  @keyframes spRun { from { left: -45%; } to { left: 100%; } }
  /* Уход — только прозрачность и масштаб: телефон рисует их видеокартой,
     без перерисовки кадра, поэтому ничего не дрожит. Прежний уход
     (растущая маска на весь экран, огромное размытое кольцо, анимированное
     свечение) пересчитывался каждый кадр, и слабые телефоны не успевали.
     В момент ухода всё «живое» (лупа, волны, точки, полоса) замирает на
     месте, а не дёргается, и плавно гаснет; логотип мягко увеличивается и
     тает; вся заставка растворяется, под ней уже готовое приложение. */
  .sp.out *, .sp.out *::before, .sp.out *::after { animation-play-state: paused; }
  .sp-dots, .sp-rings, .sp-bar, .sp-halo { transition: opacity 0.7s cubic-bezier(.37,0,.63,1); }
  .sp.out .sp-dots, .sp.out .sp-rings, .sp.out .sp-bar { opacity: 0; }
  .sp-name { transition: opacity 0.8s cubic-bezier(.37,0,.63,1), transform 0.9s cubic-bezier(.37,0,.63,1); }
  .sp.out .sp-name { opacity: 0; transform: translateY(-12px); }
  .sp.out .sp-mark { animation: spExitMark 1.5s cubic-bezier(.37,0,.63,1) 0.15s both; animation-play-state: running; }
  @keyframes spExitMark {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.25); opacity: 0; }
  }
  .sp.out .sp-halo { animation: spExitHalo 1.2s cubic-bezier(.37,0,.63,1) both; animation-play-state: running; }
  @keyframes spExitHalo {
    0% { opacity: 0.7; transform: scale(1); }
    35% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  .sp { will-change: opacity; }
  .sp.out { animation: spFade 1.3s cubic-bezier(.37,0,.63,1) 0.6s both; }
  @keyframes spFade { from { opacity: 1; } to { opacity: 0; } }
  /* Без движения: сразу итоговый кадр, без летящих точек и волн. */
  @media (prefers-reduced-motion: reduce) {
    .sp-dot, .sp-ring, .sp-bar { display: none; }
    .sp *, .sp.out { animation-duration: 0.01ms !important; animation-delay: 0s !important; }
  }
</style>

<div class="sp" id="sp" aria-hidden="true">

  <div class="sp-c">

    <div class="sp-halo"></div>
    <div class="sp-mark">

          </linearGradient>
          <radialGradient id="spGlass" cx="0.38" cy="0.35" r="0.75">
            <stop offset="0" stop-color="#7fd8ff" stop-opacity="0.45"/><stop offset="1" stop-color="#1e9bff" stop-opacity="0.08"/>
          </radialGradient>
          <clipPath id="spClip"><circle cx="41.6" cy="71.5" r="17"/></clipPath>
        </defs>
        <!-- Корпус кошелька: разрыв слева снизу — там лупа. -->
        <path class="sp-s" style="--d:0.1s;--l:0.75s" pathLength="1"

        <g class="sp-lens">
          <circle class="sp-glass" cx="41.6" cy="71.5" r="17"/>
          <g clip-path="url(#spClip)">
            <rect class="sp-shine" x="22" y="48" width="9" height="48" fill="#fff" opacity="0.28"/>
          </g>
          <circle class="sp-s" style="--d:0.7s;--l:0.55s" pathLength="1" cx="41.6" cy="71.5" r="18.2"

          <path class="sp-s" style="--d:1.0s;--l:0.3s" pathLength="1" d="M31 69.9 A11.5 11.5 0 0 1 42.3 60"/>

<script>
  (function () {
    var sp = document.getElementById("sp");
    if (!sp) return;
    var t0 = Date.now();
    var name = sp.querySelector(".sp-name"), word = "WALLET TRACKER", html = "";
    for (var i = 0; i < word.length; i++)
      html += word[i] === " " ? '<span class="sp-sp" style="--i:' + i + '"></span>'
                              : '<span style="--i:' + i + '">' + word[i] + "</span>";
    name.innerHTML = html;
    var dots = sp.querySelector(".sp-dots"), cols = ["#7fd8ff", "#1e9bff", "#3ddc97", "#7fd8ff", "#ffc24d"], d = "";
    for (var j = 0; j < 30; j++) {
      d += '<i class="sp-dot" style="--a:' + Math.round(Math.random() * 360) + "deg;--d:" +
           Math.round(130 + Math.random() * 170) + "px;--s:" + (2 + Math.random() * 3).toFixed(1) +
           "px;--t:" + (1.1 + Math.random() * 1.1).toFixed(2) + "s;--w:" + (Math.random() * 1.6).toFixed(2) +
           "s;--col:" + cols[j % cols.length] + '"></i>';
    }
    dots.innerHTML = d;
    // Приложение — только после всего вступления: последним заканчивается
    // блик по лупе (2,1 с), плюс миг, чтобы логотип успели рассмотреть.
    var min = 2400, gone = false;
    function leave() {
      if (gone) return;
      gone = true;
      sp.classList.add("out");
      // Лёгкая вибрация — когда заставка начинает растворяться.
      setTimeout(function () {
        try { window.Telegram.WebApp.HapticFeedback.impactOccurred("soft"); } catch (e) {}
      }, 600);
      setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 2000);
    }
    // Приложение говорит «готово» — уходим, но не раньше конца анимации.
    // Не дождались данных за 6 секунд — уходим всё равно: заставка не
    // должна держать человека дольше самого приложения.
    window.__wtSplash = function () { setTimeout(leave, Math.max(0, min - (Date.now() - t0))); };
    setTimeout(leave, 6000);
  })();
</script>
